<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบหลังร้าน - เวลาพักคาเฟ่</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Kanit', sans-serif; margin: 0; padding: 0; }
        body { background: #121212; color: #fff; padding: 20px; display: flex; justify-content: center; }
        .admin-card { background: #1e1e1e; width: 100%; max-width: 550px; padding: 24px; border-radius: 20px; border: 1px solid #333; }
        h2 { color: #f59e0b; margin-bottom: 20px; text-align: center; }
        
        .live-queue-box {
            background: #2a241e;
            border: 1px solid #f59e0b;
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 20px;
        }
        .queue-title { font-size: 14px; font-weight: 600; color: #f59e0b; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .btn-clear-all {
            background: #ef4444; color: #fff; border: none; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer;
        }
        .queue-item {
            background: #181310; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; border-radius: 8px; margin-bottom: 6px;
        }
        .queue-info strong { color: #fef3c7; font-size: 15px; }
        .btn-quick-add { background: #f59e0b; color: #000; border: none; padding: 6px 12px; border-radius: 8px; font-weight: 700; cursor: pointer; }

        .search-container { position: relative; margin-bottom: 16px; }
        label { display: block; font-size: 14px; color: #aaa; margin-bottom: 6px; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #444; background: #2a2a2a; color: #fff; font-size: 16px; outline: none; }
        
        .btn-search { width: 100%; background: #f59e0b; color: #000; font-weight: 700; border: none; padding: 12px; border-radius: 10px; cursor: pointer; font-size: 16px; margin-top: 8px; }
        .result-box { background: #2a2a2a; border-radius: 14px; padding: 18px; margin-top: 20px; display: none; text-align: center; }
        .pts-badge { font-size: 32px; font-weight: 700; color: #f59e0b; margin: 6px 0; }
        .section-label { font-size: 13px; color: #aaa; margin-top: 14px; margin-bottom: 8px; font-weight: 500; text-align: left; }
        .num-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        .btn-num { background: #10b981; color: #fff; border: none; padding: 10px 0; border-radius: 8px; font-weight: 700; font-size: 15px; cursor: pointer; }
        .btn-sub-num { background: #ef4444; color: #fff; border: none; padding: 8px 0; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; }
        .btn-use-voucher { background: #eab308; color: #000; width: 100%; margin-top: 14px; padding: 12px; border: none; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div id="authModal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 99999;">
  <div style="background: #1e1e1e; padding: 30px; border-radius: 16px; text-align: center; width: 320px; border: 1px solid #444; box-shadow: 0 10px 25px rgba(0,0,0,0.8);">
    <h3 style="color: #f59e0b; margin-bottom: 15px; font-size: 20px;">🔒 ล็อกอินหลังร้าน</h3>
    <input type="password" id="adminPasswordInput" placeholder="กรอกรหัสผ่านพนักงาน" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #555; background: #2a2a2a; color: #fff; text-align: center; font-size: 16px; margin-bottom: 15px; outline: none;">
    <button onclick="checkAdminPassword()" style="width: 100%; padding: 12px; background: #f59e0b; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px;">เข้าสู่ระบบ</button>
    <p id="authErrorMsg" style="color: #ef4444; font-size: 13px; margin-top: 10px; display: none;">รหัสผ่านไม่ถูกต้อง!</p>
  </div>
</div>

<div class="admin-card">
    <h2>⚡ ระบบจัดการแต้มพนักงาน</h2>

    <div class="live-queue-box">
        <div class="queue-title">
            <span>🔔 ลูกค้าเพิ่งเช็คอิน/ใส่ชื่อ</span>
            <button class="btn-clear-all" onclick="clearAllQueue()">ล้างคิว</button>
        </div>
        <div id="queueList">
            <div style="font-size: 12px; color: #777; text-align: center;">ยังไม่มีลูกค้าลงทะเบียนใหม่</div>
        </div>
    </div>

    <div class="search-container">
        <label>ค้นหาด้วยเบอร์โทรศัพท์ลูกค้า</label>
        <input type="text" id="searchInput" placeholder="กรอกเบอร์โทร 10 หลัก" maxlength="10">
        <button class="btn-search" onclick="searchCustomer()">ค้นหาข้อมูล</button>
    </div>

    <div class="result-box" id="resultBox">
        <div id="custNameDisplay" style="font-size: 18px; font-weight: 600; color: #fef3c7; margin-bottom: 4px;"></div>
        <div id="custPhone" style="font-size: 14px; color: #aaa; margin-bottom: 8px;"></div>
        
        <div class="pts-badge"><span id="custPoints">0</span> แต้ม</div>
        <div style="font-size: 14px; color: #f59e0b;">คูปองสะสมฟรี: <strong id="custVouchers">0</strong> ใบ</div>

        <div class="section-label">➕ เพิ่มจำนวนแก้ว:</div>
        <div class="num-grid">
            <button class="btn-num" onclick="updatePoints(1)">+1</button>
            <button class="btn-num" onclick="updatePoints(2)">+2</button>
            <button class="btn-num" onclick="updatePoints(3)">+3</button>
            <button class="btn-num" onclick="updatePoints(4)">+4</button>
            <button class="btn-num" onclick="updatePoints(5)">+5</button>
        </div>

        <div class="section-label" style="color: #ef4444;">↩️ ลดแต้ม:</div>
        <div class="num-grid">
            <button class="btn-sub-num" onclick="updatePoints(-1)">-1</button>
            <button class="btn-sub-num" onclick="updatePoints(-2)">-2</button>
            <button class="btn-sub-num" onclick="updatePoints(-3)">-3</button>
            <button class="btn-sub-num" onclick="updatePoints(-4)">-4</button>
            <button class="btn-sub-num" onclick="updatePoints(-5)">-5</button>
        </div>

        <button class="btn-use-voucher" onclick="useVoucher()">🎁 ใช้คูปองฟรี 1 ใบ</button>
    </div>
</div>

<script>
    const ADMIN_SECRET_CODE = "081218";

    function checkAdminPassword() {
        const inputVal = document.getElementById('adminPasswordInput').value;
        if (inputVal === ADMIN_SECRET_CODE) {
            document.getElementById('authModal').style.display = 'none';
            localStorage.setItem('isSecureAdminLoggedIn', 'true');
        } else {
            document.getElementById('authErrorMsg').style.display = 'block';
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        if (localStorage.getItem('isSecureAdminLoggedIn') === 'true') {
            document.getElementById('authModal').style.display = 'none';
        }
    });

    // แก้ไข URL ฐานข้อมูลให้ตรงกับหน้าลูกค้า (wela-phak-cafe)
    const firebaseConfig = { 
        databaseURL: "https://wela-phak-cafe-default-rtdb.asia-southeast1.firebasedatabase.app/" 
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let activePhone = '';

    database.ref('recent_checkins').limitToLast(10).on('value', (snapshot) => {
        const queueList = document.getElementById('queueList');
        queueList.innerHTML = '';
        if (!snapshot.exists()) {
            queueList.innerHTML = '<div style="font-size: 12px; color: #777; text-align: center;">ยังไม่มีลูกค้าลงทะเบียนใหม่</div>';
            return;
        }

        snapshot.forEach(child => {
            const item = child.val();
            const div = document.createElement('div');
            div.className = 'queue-item';
            div.innerHTML = `<div class="queue-info"><strong>คุณ ${item.name}</strong> (${item.phone})</div><button class="btn-quick-add" onclick="quickSelect('${item.phone}')">จัดการ</button>`;
            queueList.insertBefore(div, queueList.firstChild);
        });
    });

    function clearAllQueue() { database.ref('recent_checkins').remove(); }
    
    function quickSelect(phone) {
        document.getElementById('searchInput').value = phone;
        searchCustomer();
    }

    function searchCustomer() {
        const phone = document.getElementById('searchInput').value.trim();
        if (phone.length < 9) { alert('กรุณากรอกเบอร์โทรให้ถูกต้อง'); return; }
        activePhone = phone;

        database.ref('loyalty/' + phone).on('value', (snapshot) => {
            const data = snapshot.exists() ? snapshot.val() : { points: 0, vouchers: 0, name: 'ลูกค้าใหม่' };
            document.getElementById('resultBox').style.display = 'block';
            document.getElementById('custNameDisplay').innerText = `คุณ ${data.name || 'ทั่วไป'}`;
            document.getElementById('custPhone').innerText = phone;
            document.getElementById('custPoints').innerText = data.points || 0;
            document.getElementById('custVouchers').innerText = data.vouchers || 0;
        });
    }

    function updatePoints(change) {
        if (!activePhone) return;
        database.ref('loyalty/' + activePhone).once('value', (snapshot) => {
            let pts = (snapshot.exists() && snapshot.val().points) ? snapshot.val().points : 0;
            let vchs = (snapshot.exists() && snapshot.val().vouchers) ? snapshot.val().vouchers : 0;
            let name = snapshot.exists() ? (snapshot.val().name || '') : '';

            pts += change;
            if (pts < 0) pts = 0;
            if (pts >= 10) {
                const newVs = Math.floor(pts / 10);
                vchs += newVs;
                pts %= 10;
                alert(`🎉 ครบ 10 แต้ม! ได้รับคูปอง ${newVs} ใบ`);
            }

            database.ref('loyalty/' + activePhone).set({ points: pts, vouchers: vchs, name: name });
        });
    }

    function useVoucher() {
        if (!activePhone) return;
        database.ref('loyalty/' + activePhone).once('value', (snapshot) => {
            if (!snapshot.exists() || (snapshot.val().vouchers || 0) <= 0) { alert('ไม่มีคูปองคงเหลือ'); return; }
            let data = snapshot.val();
            database.ref('loyalty/' + activePhone).update({ vouchers: data.vouchers - 1 });
            alert('ใช้คูปองสำเร็จ!');
        });
    }
</script>
</body>  
</html>
